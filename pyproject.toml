[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "exif-inspect"
version = "0.4.0"
description = "EXIF metadata, provenance signals, forensic hints and error level analysis for images."
readme = "README.md"
license = "MIT"
authors = [{ name = "Xiaoyu Yan" }]
requires-python = ">=3.10"
dependencies = ["Pillow>=9.4", "numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest"]
heic = ["pillow-heif"]
keypoints = ["opencv-python-headless>=4.5"]
prnu = ["PyWavelets>=1.4"]

[project.scripts]
exif-inspect = "exif_inspect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
